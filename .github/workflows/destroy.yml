#Name of pipeline
name: Destroy AWS CDK Infrastructure

#Manually triggered from GitHub Actions UI
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - prod
          - all
      confirm:
        description: 'Type "destroy" to confirm teardown'
        required: true
        type: string

#Stages
jobs:
  aws_cdk_destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'

    steps:
      #Copies repo into the runner
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      #Installs NodeJS
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      #Installs Python
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      #Installs AWS CDK CLI and dependencies
      - name: Install CDK Core CLI
        run: npm install -g aws-cdk

      #Installs Pip dependencies for AWS CDK CLI
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aws-cdk-lib constructs

      #Configures AWS credentials referencing secrets stored in GitHub
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      #Destroys the dev stack
      - name: Destroy Dev Infrastructure Stack
        if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'all'
        run: cdk destroy DevVpcStack --force -c env=dev

      #Destroys the prod stack
      - name: Destroy Prod Infrastructure Stack
        if: github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'all'
        run: cdk destroy ProdVpcStack --force -c env=prod
