#Name of pipeline
name: Deploy AWS CDK Infrastructure

#Activates pipeline when code is pushed to main or dev
on:
  push:
    branches: [ main, dev ]

#Stages
jobs:
  aws_cdk_deploy:
    runs-on: ubuntu-latest

    steps:
      #Copies repo into the runner
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      #Determines which environment to deploy based on branch
      - name: Set Environment
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "STACK_NAME=ProdVpcStack" >> $GITHUB_OUTPUT
          else
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "STACK_NAME=DevVpcStack" >> $GITHUB_OUTPUT
          fi

      #Installs NodeJS
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      #Installs Python
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      #Installs AWS CDK CLI and dependencies
      - name: Install CDK Core CLI
        run: npm install -g aws-cdk

      #Installs Pip dependencies for AWS CDK CLI
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aws-cdk-lib constructs

      #Configures AWS credentials referencing secrets stored in GitHub
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      #Gets the AWS account ID from the configured credentials
      - name: Get AWS Account ID
        id: aws-account
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      #Bootstraps the AWS CDK environment and deploys the infrastructure stack
      - name: Bootstrap AWS CDK Environment
        run: cdk bootstrap aws://${{ steps.aws-account.outputs.ACCOUNT_ID }}/us-east-1

      #Deploys the target environment stack without requiring approval
      - name: Deploy ${{ steps.set-env.outputs.ENV }} Infrastructure Stack
        run: cdk deploy ${{ steps.set-env.outputs.STACK_NAME }} --require-approval never -c env=${{ steps.set-env.outputs.ENV }}
